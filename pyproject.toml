[project]
name = "ota-web-agent"
version = "0.2.0"
description = "Audited mTLS OTA console SDK, CLI, HTTP API and MCP deployment workflows"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<48",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=2.3,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
ota = "ota_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ota_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
